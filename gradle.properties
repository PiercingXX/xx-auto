# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m

# AndroidX is required for all Jetpack libraries.
android.useAndroidX=true

# Official Kotlin code style.
kotlin.code.style=official

# Reference R classes from their own module only (single-module build).
android.nonTransitiveRClass=true

# AGP 8.5.2 was tested up to compileSdk 34; compileSdk 35 is the design
# requirement and builds fine. Silence the cosmetic warning.
android.suppressUnsupportedCompileSdk=35